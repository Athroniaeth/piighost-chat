services:
  piighost-api:
    image: ghcr.io/athroniaeth/piighost-api:latest
    environment:
      - PIIGHOST_CONFIG=/app/pipeline.toml
      # keyshield API-key auth pepper (distinct from the piighost secrets below).
      - SECRET_PEPPER=${SECRET_PEPPER:-}
      - API_KEY_default=${PIIGHOST_API_KEY:-}
      - EXTRA_PACKAGES=piighost[gliner2,config,redis,crypto,argon2]
      # piighost 1.0 Redis thread memory (pipeline.toml [memory]) encrypts stored
      # values, so both secrets are required for the server to boot.
      - PIIGHOST_HASH_PEPPER=${PIIGHOST_HASH_PEPPER:-}
      - PIIGHOST_CIPHER_KEY=${PIIGHOST_CIPHER_KEY:-}
      # piighost 1.0 is OpenTelemetry-native; point this at an OTLP endpoint to
      # export the pipeline's spans (needs the piighost[observation] extra).
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./pipeline.toml:/app/pipeline.toml
      - huggingface-cache:/root/.cache/huggingface
      - uv-cache:/root/.cache/uv
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=piighost
      - POSTGRES_PASSWORD=piighost
      - POSTGRES_DB=piighost_chat
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piighost -d piighost_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  huggingface-cache:
  uv-cache:
  postgres-data:
